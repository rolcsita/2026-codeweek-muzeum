:root{font-family:system-ui,Segoe UI,sans-serif;color:#e8eef9;background:#101a2b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#263b55,#101a2b 75%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #546a83;background:#243b53;color:#fff;border-radius:10px;padding:11px 15px}button:hover:not(:disabled){background:#38516a}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#d1a653;color:#192333;border-color:#efd18a;font-weight:800}.primary:hover:not(:disabled){background:#efd18a}.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}header{display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:1px solid #41536c;padding-bottom:16px}.brand{letter-spacing:.17em;text-transform:uppercase;color:#d6b56e;font-size:13px;font-weight:800}.subtitle{font-size:13px;color:#aebdd0}.panel{background:#1b2b40;border:1px solid #3b536b;border-radius:16px;padding:20px;margin-top:18px}.story{background:#2d3443;border-left:4px solid #d1a653;padding:16px;border-radius:8px;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:18px}.clue{background:#27384d;border-radius:10px;padding:12px;margin:8px 0}.grid{display:grid;gap:8px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.five{grid-template-columns:repeat(5,minmax(0,1fr))}.tile{min-height:62px;border:1px solid #6c8095;border-radius:10px;background:#2c435a;padding:8px;text-align:center}.wall{background:#111a26}.target{background:#245d4e}.active{outline:3px solid #dbb463}.dim{color:#aebdd0}.buttonrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.step{padding:9px;border:1px solid #536781;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:12px}.selected{border-color:#f4d382;background:#485372}.feedback{padding:14px;border-radius:10px;background:#284357;margin-top:14px;line-height:1.5}.ok{border:1px solid #5bac92}.bad{border:1px solid #cf857d}.progress{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}.progress span{width:26px;height:8px;border-radius:6px;background:#52657b}.progress .done{background:#d1a653}.tag{font-size:12px;color:#f4d48f}.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}.screen{font-size:30px;text-align:center;letter-spacing:.2em;background:#0d1724;padding:14px;border-radius:8px;margin:12px auto;max-width:260px}.card{border:1px solid #617388;background:#293c51;border-radius:10px;padding:14px;text-align:left}.card:hover{background:#39516a}.card.selected{background:#615638}.shapes{font-size:30px}.small{font-size:13px}.evidence{font-size:14px;line-height:1.6;color:#c9d6e5}h1{font-size:clamp(26px,4vw,42px);margin:16px 0}h2{font-size:25px;margin:6px 0 18px}h3{font-size:17px;color:#e5c583}p{line-height:1.6}.laser{height:120px;display:flex;justify-content:space-around;align-items:stretch;background:#111c2d;border-radius:10px;padding:10px}.beam{width:12px;background:linear-gradient(90deg,#8c111d,#ff6e7a,#8c111d);box-shadow:0 0 14px #ff3049}.beam.off{background:#365750;box-shadow:none;opacity:.45}.award{text-align:center;border:double 7px #c7a35c;border-radius:18px;padding:45px 15px;background:#202d3e}.award h1{font-family:Georgia,serif;color:#eace8a}.award .seal{font-size:65px}.hidden{display:none}.legend{font-size:12px;color:#b5c5d7}@media(max-width:720px){.layout{grid-template-columns:1fr}.four{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}header{align-items:flex-start}}

const KEY='koddetektivek-v1';let S;const $=id=>document.getElementById(id),app=$('app');const rand=()=>{let x=S.seed|0;x^=x<<13;x^=x>>>17;x^=x<<5;S.seed=x|0;return (x>>>0)/4294967296};const ri=n=>Math.floor(rand()*n);const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=ri(i+1);[b[i],b[j]]=[b[j],b[i]]}return b};const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const initial=()=>({seed:(Math.random()*0x7fffffff)|0,stage:0,done:[],data:{},attempts:{},started:false});try{S=JSON.parse(localStorage.getItem(KEY))||initial()}catch{S=initial()};const names=['Kamerafelvételek','Biztonsági szoba','Az őr útvonala','Titkos üzenet','A raktár titka','Cipőtalpminta','Lézerrendszer','Szabotált járőrrobot','A gyanúsítottak alibije','A végső leleplezés'];const descriptions=['A felvételek bizonyítják: ismeretlen alak járt a lezárt folyosón.','A napló szerint valaki módosította a biztonsági rendszer működését.','Az őr a lopás idején a múzeum másik részén járőrözött.','A titkosított üzenet a raktárba irányította a nyomozást.','A raktárban rejtett belépőkártyát találtál.','A sérült cipőtalplenyomatot sikerült rekonstruálnod.','Karbantartói jogosultsággal kapcsolták ki a lézervédelmet.','A járőrrobot programjából valaki ellenőrzéseket törölt.','Két egymást kiegészítő adat megcáfolja a karbantartó alibijét.'];const icons=['📹','🔐','🚶','✉️','📦','👣','⚡','🤖','🕵️','🏅'];const stageTitle=n=>`<div class="tag">${n+1}. pálya / 10 · ${n===0||n===3?'Könnyű':n===4||n===5||n===6||n===8||n===9?'Nehezebb':'Közepes'}</div><h2>${icons[n]} ${names[n]}</h2>`;
function ensure(n,make){if(!S.data[n]){S.data[n]=make();save()}return S.data[n]};function notice(t,good=false){let el=$('feedback');if(el){el.className='feedback '+(good?'ok':'bad');el.textContent=t}}function complete(n){if(!S.done.includes(n))S.done.push(n);S.stage=Math.max(S.stage,n+1);save();app.innerHTML=`<section class="panel"><h2>✓ Pálya teljesítve!</h2><p>${descriptions[n]}</p><div class="feedback ok"><b>Megszerezted a(z) ${n+1}. bizonyítékot.</b><p>${descriptions[n]}</p></div><button class="primary" onclick="render()">Következő pálya →</button></section>`;progress()};function progress(){$('progress').innerHTML=names.map((_,i)=>`<span title="${i+1}. ${names[i]}" class="${S.done.includes(i)?'done':''}"></span>`).join('')};function shell(n,intro,instructions,content){app.innerHTML=`<section class="panel">${stageTitle(n)}<div class="story">${intro}</div><p><b>${instructions}</b></p>${content}<div id="feedback"></div></section>`};function showBoard(){const back=S.stage;app.innerHTML=`<section class="panel"><h2>Nyomozótábla</h2><p>Az eddig megszerzett bizonyítékok:</p>${descriptions.map((x,i)=>S.done.includes(i)?`<div class="clue"><b>${i+1}. ${names[i]}</b><div class="evidence">${x}</div></div>`:'').join('')||'<p>Még nincs bizonyítékod.</p>'}<button onclick="render()">Vissza a nyomozáshoz</button></section>`}
function p0(){let d=ensure(0,()=>{let base=22*60+ri(20),times=[base,base+3,base+7,base+12],ev=['A takarító távozik a folyosóról.','Egy ismeretlen alak lép be.','A kamera képe elsötétül.','A kamera újra működik.'];return {items:shuffle(times.map((t,i)=>({t,ev:ev[i]})))} });let fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;shell(0,'A gyémánt eltűnt! A számítógép összekeverte a biztonsági kamera négy utolsó felvételét.','Állítsd időrendbe a felvételeket! A legkorábbival kezdd.',`<div id="order"></div><button class="primary" onclick="check0()">Ellenőrzés</button>`);$('order').innerHTML=d.items.map((o,i)=>`<div class="step"><span><b>${fmt(o.t)}</b> – ${o.ev}</span><span><button onclick="move0(${i},-1)" ${i===0?'disabled':''}>↑</button> <button onclick="move0(${i},1)" ${i===3?'disabled':''}>↓</button></span></div>`).join('')};function move0(i,j){let a=S.data[0].items,k=i+j;[a[i],a[k]]=[a[k],a[i]];save();p0()}function check0(){let a=S.data[0].items;if(a.every((o,i)=>i===0||a[i-1].t<o.t))complete(0);else notice('Még nem jó a sorrend. Figyeld meg az időpontokat!')}
function mk1(){// construct with unique solution by enumeration
for(let tries=0;tries<200;tries++){let c=ri(3)+1,d=ri(4)+1,b=2*d,a=c+ri(4)+1,sum=a+b+c+d;if(a>9||new Set([a,b,c,d]).size<4||sum>25)continue;let solutions=[];for(let x=0;x<10;x++)for(let y=0;y<10;y++)for(let z=0;z<10;z++)for(let w=0;w<10;w++)if(y===2*w&&x===z+(a-c)&&x+y+z+w===sum&&z===c&&new Set([x,y,z,w]).size===4)solutions.push([x,y,z,w]);if(solutions.length===1)return {code:[a,b,c,d].join(''),clues:shuffle([`A harmadik számjegy ${c}.`,`Az első számjegy ${a-c}-mal nagyobb a harmadiknál.`,`A második számjegy kétszer akkora, mint a negyedik.`,`A négy számjegy összege ${sum}.`,'Mind a négy számjegy különböző.']),input:''}}return{code:'5623',clues:shuffle(['A harmadik számjegy 2.','Az első számjegy 3-mal nagyobb a harmadiknál.','A második számjegy kétszer akkora, mint a negyedik.','A négy számjegy összege 16.','Mind a négy számjegy különböző.']),input:''}}function p1(){let d=ensure(1,mk1);shell(1,'A lezárt biztonsági szoba ajtaján számzár van. Mellette öt különálló cetlit találsz.','Fejtsd meg a négyjegyű kódot! Mind az öt nyomot használd!',`<div class="grid three">${d.clues.map(t=>`<div class="clue">${t}</div>`).join('')}</div><div class="screen" id="code">${(d.input||'').padEnd(4,'–')}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','Törlés','0','⌫'].map(t=>`<button onclick="key1('${t}')">${t}</button>`).join('')}</div><div class="buttonrow"><button class="primary" onclick="check1()">Ajtó nyitása</button></div>`)}function key1(k){let d=S.data[1];d.input=k==='Törlés'?'':k==='⌫'?d.input.slice(0,-1):d.input.length<4?d.input+k:d.input;$('code').textContent=d.input.padEnd(4,'–');save()}function check1(){if(S.data[1].input===S.data[1].code)complete(1);else notice('Hibás kód. Ellenőrizd az összes feltételt!')}
function mk2(){// one-correction guaranteed directed corridor path: simple horizontal row with detour walls, 7 steps
let start=0,target=18,wall=[4,9,14,19,20,21,22,23,24],solution=['R','R','D','D','R','D','D']; // ends 18? 0->1->2->7->12->13->18->23 BAD. replace stable grid
let s=[0,1,6,7,12,13,18],cmd=['R','D','R','D','R','D'];return {path:s,cmd,commands:cmd.map((x,i)=>i===ri(0)?x:x),broken:0}}
function mk2b(){let variants=[{path:[0,1,6,7,12,13,18],cmd:['R','D','R','D','R','D']},{path:[0,5,6,11,12,17,18],cmd:['D','R','D','R','D','R']}];let v=variants[ri(2)],wrong=ri(6),wrongCmd=['U','D','L','R'].filter(x=>x!==v.cmd[wrong])[ri(3)];return {...v,commands:v.cmd.map((x,i)=>i===wrong?wrongCmd:x),pos:v.path[0],trail:[],ran:false}}const dir={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]},arr=['U','D','L','R'];function p2(){let d=ensure(2,mk2b);let cells=Array.from({length:25},(_,i)=>{let walls=[2,3,4,8,9,14,19,20,21,22,23,24];return `<div class="tile ${walls.includes(i)?'wall':''} ${i===18?'target':''} ${d.trail.includes(i)?'selected':''}">${i===d.pos?'🤖':i===18?'💎':walls.includes(i)?'▦':''}</div>`}).join('');shell(2,'Az őr elektronikus útvonalnaplójában egyetlen hibás irányt találtunk.','A mozgási utasítások között egy hibás. Változtathatsz több nyilat is. Futtasd a programot, és juttasd el az őrt a gyémántterem ajtajáig!',`<div class="layout"><div><div class="grid five">${cells}</div><p class="legend">🤖 Őr · 💎 Cél · ▦ Fal</p></div><div><h3>Utasítások</h3><div class="buttonrow">${d.commands.map((x,i)=>`<button class="${d.pick===i?'selected':''}" onclick="pick2(${i})">${{U:'↑',D:'↓',L:'←',R:'→'}[x]}</button>`).join('')}</div><p class="small dim">Válassz egy nyilat, majd módosítsd:</p><div class="buttonrow">${arr.map(x=>`<button onclick="set2('${x}')">${{U:'↑',D:'↓',L:'←',R:'→'}[x]}</button>`).join('')}</div></div></div><div class="buttonrow"><button class="primary" id="run2" onclick="run2()">▶ FUTTATÁS</button><button onclick="reset2()">Újrakezdés</button></div>`)}function pick2(i){S.data[2].pick=i;save();p2()}function set2(x){let d=S.data[2];if(d.pick===undefined)return;d.commands[d.pick]=x;d.pos=d.path[0];d.trail=[];save();p2()}function reset2(){let d=S.data[2];d.pos=d.path[0];d.trail=[];save();p2()}let busy=false;async function run2(){if(busy)return;busy=true;let d=S.data[2];d.pos=d.path[0];d.trail=[d.pos];p2();let failed=false;for(const c of d.commands){await new Promise(r=>setTimeout(r,540));let y=Math.floor(d.pos/5),x=d.pos%5;let ny=y+dir[c][0],nx=x+dir[c][1],next=ny*5+nx;if(ny<0||ny>4||nx<0||nx>4||[2,3,4,8,9,14,19,20,21,22,23,24].includes(next)){failed=true;break}d.pos=next;d.trail.push(next);p2()}busy=false;save();if(!failed&&d.pos===18)complete(2);else notice('Az őr nem jutott el a célhoz. Figyeld meg, hol tért el az útvonaltól!')}
const AL='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const messages=['NEZD MEG A RAKTART','A NYOM A RAKTARBAN VAN','KERESD A RAKTART'];function mk3(){return{msg:messages[ri(messages.length)],shift:ri(19)+3,answer:''}}function normalize(s){return s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z]/g,'')};function p3(){let d=ensure(3,mk3);let enc=d.msg.split('').map(c=>AL.includes(c)?AL[(AL.indexOf(c)+d.shift)%26]:c).join('');shell(3,'A biztonsági szobában egy titkosított üzenetet találtál. Ez vezethet a következő nyomhoz.','A táblázat alapján fejtsd meg a rejtjelezett mondatot, majd írd be a megfejtést!',`<div class="clue" style="font-size:25px;letter-spacing:.13em;text-align:center">${enc}</div><p class="small dim">Felső sor: kódolt betű · alsó sor: eredeti betű</p><div class="grid" style="grid-template-columns:repeat(13,minmax(0,1fr));font-size:12px;text-align:center;overflow:auto">${AL.split('').map(c=>`<div class="tile" style="min-height:25px;padding:4px">${c}</div>`).join('')}${AL.split('').map(c=>`<div class="tile" style="min-height:25px;padding:4px">${AL[(AL.indexOf(c)-d.shift+26)%26]}</div>`).join('')}</div><p><input id="ans3" aria-label="Megfejtés" style="width:100%;padding:13px" placeholder="A megfejtett üzenet..." value="${d.answer}"></p><button class="primary" onclick="check3()">Ellenőrzés</button>`)}function check3(){let d=S.data[3];d.answer=$('ans3').value;save();if(normalize(d.answer)===normalize(d.msg))complete(3);else notice('Még nem jó a megfejtés. Keresd meg sorban a kódolt betűket!')}
const colors=['Piros','Kék','Zöld','Sárga'],shapes=['▲','●','★'];function mk4(){let col=shuffle([0,1,2,3]),allowed=col.slice(0,2),parity=ri(2),shape=ri(3),answer={col:allowed[ri(2)],num:parity?7:8,shape};let crates=[answer];while(crates.length<9){let c={col:ri(4),num:ri(9)+1,shape:ri(3)};if(allowed.includes(c.col)&&c.num%2===parity&&c.shape===shape)continue;if(crates.some(x=>x.col===c.col&&x.num===c.num&&x.shape===c.shape))continue;crates.push(c)}crates=shuffle(crates);return{crates,allowed,parity,shape,picked:null}}function p4(){let d=ensure(4,mk4);shell(4,'A titkos üzenet a múzeum raktárába vezetett. Kilenc számozott láda közül egyben bizonyíték rejtőzik.','Válaszd ki azt az egy ládát, amelyik minden feltételnek megfelel!',`<div class="clue">A láda <b>${colors[d.allowed[0]]} vagy ${colors[d.allowed[1]]}</b>; a száma <b>${d.parity?'páratlan':'páros'}</b>; a jele <b>${shapes[d.shape]}</b>.</div><div class="grid three">${d.crates.map((c,i)=>`<button class="card ${d.picked===i?'selected':''}" onclick="pick4(${i})"><div class="shapes">📦 ${shapes[c.shape]}</div><b>${c.num}</b><div>${colors[c.col]}</div></button>`).join('')}</div><div class="buttonrow"><button class="primary" onclick="check4()">Láda kinyitása</button></div>`)}function pick4(i){S.data[4].picked=i;save();p4()}function check4(){let d=S.data[4],c=d.crates[d.picked];if(!c)return notice('Először válassz egy ládát!');if(d.allowed.includes(c.col)&&c.num%2===d.parity&&c.shape===d.shape)complete(4);else notice('Nem ebben a ládában van a nyom. Ellenőrizd mindhárom feltételt!')}
const sym=['●','▲','■','◆'];function mk5(){let base=shuffle([0,1,2,3]),missing=shuffle(Array.from({length:16},(_,i)=>i)).slice(0,5);return{base,missing,picked:null,fill:{}}}function sol5(d,i){return d.base[(Math.floor(i/4)+i%4)%4]}function p5(){let d=ensure(5,mk5);shell(5,'A raktár poros padlóján részben elmosódott cipőtalplenyomatot találtál. A mintázat szabályosan ismétlődik.','Figyeld meg a sorokat és az oszlopokat is! Pótold az öt hiányzó jelet!',`<div class="grid four" style="max-width:450px;margin:auto">${Array.from({length:16},(_,i)=>`<button class="tile shapes ${d.picked===i?'selected':''}" onclick="pick5(${i})">${d.missing.includes(i)?(d.fill[i]===undefined?'?':sym[d.fill[i]]):sym[sol5(d,i)]}</button>`).join('')}</div><p class="dim small">Kattints egy kérdőjeles mezőre, majd válassz jelet.</p><div class="buttonrow">${sym.map((x,i)=>`<button onclick="fill5(${i})">${x}</button>`).join('')}</div><button class="primary" onclick="check5()">Ellenőrzés</button>`)}function pick5(i){let d=S.data[5];if(!d.missing.includes(i))return;d.picked=i;save();p5()}function fill5(i){let d=S.data[5];if(d.picked===null)return;d.fill[d.picked]=i;d.picked=null;save();p5()}function check5(){let d=S.data[5];if(d.missing.every(i=>d.fill[i]===sol5(d,i)))complete(5);else notice('Még nem megfelelő a cipőtalpminta. Figyeld meg az eltolódást a sorokban!')}
function mk6(){let sets=[[0,1],[1,2],[2,3],[0,2,3]]; // randomize beam labels and create solvable target by toggling a nonempty subset
let permutation=shuffle([0,1,2,3]),chosen=shuffle([0,1,2,3]).slice(0,ri(3)+1),beams=[false,false,false,false];let newsets=sets.map(s=>s.map(x=>permutation[x]));chosen.forEach(j=>newsets[j].forEach(i=>beams[i]=!beams[i]));return{sets:newsets,beams,initial:[...beams],presses:0}}function p6(){let d=ensure(6,mk6);shell(6,'A titkos folyosót lézersugarak védik. Négy kapcsoló működteti a rendszert, de egy kapcsoló egyszerre több lézer állapotát is megváltoztatja.','Kísérletezd ki, melyik kapcsolókat kell megnyomnod, hogy mind a négy lézer egyszerre kikapcsoljon!',`<div class="laser">${d.beams.map(x=>`<div class="beam ${x?'':'off'}"></div>`).join('')}</div><p>Aktív lézerek: <b>${d.beams.filter(Boolean).length}/4</b> · Kapcsolások: ${d.presses}</p><div class="buttonrow">${['A','B','C','D'].map((x,i)=>`<button onclick="switch6(${i})">${x} kapcsoló</button>`).join('')}<button onclick="reset6()">Visszaállítás</button></div>`)}function switch6(i){let d=S.data[6];d.sets[i].forEach(j=>d.beams[j]=!d.beams[j]);d.presses++;save();if(d.beams.every(x=>!x))complete(6);else p6()}function reset6(){let d=S.data[6];d.beams=[...d.initial];d.presses=0;save();p6()}
function mk7(){let n=ri(3)+4,miss=shuffle(Array.from({length:n},(_,i)=>i)).slice(0,ri(3)+1);return{n,missing:miss,checks:Array.from({length:n},(_,i)=>!miss.includes(i)),pos:0,inspected:[],running:false}}function p7(){let d=ensure(7,mk7);shell(7,'Valaki módosította a múzeumi járőrrobot programját. A robot egyenesen halad a termek között, de néhány ellenőrzési utasítást kitöröltek.','A LÉPÉS a következő teremhez viszi a robotot. Az ELLENŐRZÉS az aktuális termet vizsgálja meg. Pótold a hiányzó ellenőrzéseket, hogy minden termet megvizsgáljon!',`<div class="grid" style="grid-template-columns:repeat(${d.n},minmax(0,1fr))">${Array.from({length:d.n},(_,i)=>`<div class="tile ${d.inspected.includes(i)?'target':''}">${d.pos===i?'🤖':'🚪'}<br><span class="small">${i+1}.</span></div>`).join('')}</div><h3>Program</h3><div class="grid">${d.checks.map((x,i)=>`<div class="step"><span>${i>0?'LÉPÉS → ':''}<b>${x?'ELLENŐRZÉS':'[hiányzó utasítás]'}</b></span><button onclick="toggle7(${i})">${x?'Eltávolítás':'+ ELLENŐRZÉS'}</button></div>`).join('')}</div><div class="buttonrow"><button class="primary" id="run7" onclick="run7()">▶ FUTTATÁS</button><button onclick="reset7()">Eredeti program</button></div>`)}function toggle7(i){if(busy)return;let d=S.data[7];d.checks[i]=!d.checks[i];save();p7()}function reset7(){let d=S.data[7];d.checks=Array.from({length:d.n},(_,i)=>!d.missing.includes(i));d.pos=0;d.inspected=[];save();p7()}async function run7(){if(busy)return;busy=true;let d=S.data[7];d.pos=0;d.inspected=[];p7();for(let i=0;i<d.n;i++){d.pos=i;if(d.checks[i])d.inspected.push(i);p7();await new Promise(r=>setTimeout(r,600))}busy=false;save();if(d.inspected.length===d.n)complete(7);else notice(`${d.n-d.inspected.length} terem ellenőrzése kimaradt. Nézd meg, melyik utasítás hiányzik!`)}
function mk8(){let names=['Kovács Anna','Nagy Péter','Tóth Éva','Szabó Márk'];let times=[21*60+ri(40),22*60+ri(8),22*60+ri(8),22*60+ri(8)];return {times,selected:null,open:[false,false,false]}}function p8(){let d=ensure(8,mk8);shell(8,'A négy dolgozó alibijét ellenőrzöd. A karbantartó azt állítja, hogy 22:10 és 22:20 között végig a műhelyben dolgozott.','Olvasd el a bizonyítékokat! Válaszd ki, kinek az állítását cáfolják biztosan az adatok!',`<div class="grid four">${['Kovács Anna','Nagy Péter','Tóth Éva','Szabó Márk'].map((x,i)=>`<button class="card ${d.selected===i?'selected':''}" onclick="pick8(${i})"><b>${x}</b><p class="small">${['Az irodámban dolgoztam.','A főbejáratot felügyeltem.','A raktárban takarítottam.','A műhelyben dolgoztam.'][i]}</p></button>`).join('')}</div><h3>Bizonyítékok</h3><div class="clue"><b>1. A műhely kamerája</b><p>22:10-től 22:20-ig a műhely üres volt. A felvétel folyamatos, megszakítás nélkül készült.</p></div><div class="clue"><b>2. Műhelyajtó belépési naplója</b><p>Ugyanebben az időszakban senki sem lépett be a műhely egyetlen ajtaján sem.</p></div><div class="clue"><b>3. Biztonsági feljegyzés</b><p>A karbantartói jogosultságot a lopás éjszakáján használták a lézervédelem kikapcsolására.</p></div><button class="primary" onclick="check8()">Vallomás ellenőrzése</button>`)}function pick8(i){S.data[8].selected=i;save();p8()}function check8(){let i=S.data[8].selected;if(i===3)complete(8);else notice('A bizonyítékok nem cáfolják biztosan ennek a dolgozónak az állítását. Vizsgáld meg újra a műhely adatait!')}
function p9(){let d=ensure(9,()=>({suspect:null,method:null,proofs:[]}));let method=['A biztonsági rendszer módosításával és a robot ellenőrzéseinek kihagyásával.','Egy ablakon át jutott be.','A gyémántot nappal, nyitvatartás közben vitte el.'];let people=['Kovács Anna – igazgató','Nagy Péter – biztonsági őr','Tóth Éva – takarító','Szabó Márk – karbantartó'];let proofs=[['Karbantartói jogosultság','A lézervédelmet karbantartói jogosultsággal kapcsolták ki.'],['Szabotált robot','A járőrrobot programjából ellenőrzéseket töröltek.'],['Hamis alibi','A műhely felvétele és belépési naplója cáfolja Szabó Márk állítását.'],['Kamerafelvétel','Ismeretlen személy lépett a lezárt folyosóra.'],['Titkos üzenet','A raktárhoz vezetett.'],['Cipőtalpminta','Részben helyreállított lenyomat; önmagában nem azonosít személyt.']];shell(9,'A Kék Csillag rejtélye a végéhez ért. A nyomozati akták alapján állítsd össze a jelentésedet!','Válaszd ki a legvalószínűbb tettest, a módszert és három olyan bizonyítékot, amely együtt alátámasztja a következtetésedet!',`<div class="layout"><div><h3>1. Kit gyanúsítasz?</h3>${people.map((x,i)=>`<div class="step"><label><input type="radio" name="sus" onchange="sel9('suspect',${i})" ${d.suspect===i?'checked':''}> ${x}</label></div>`).join('')}<h3>2. Hogyan játszották ki a védelmet?</h3>${method.map((x,i)=>`<div class="step"><label><input type="radio" name="met" onchange="sel9('method',${i})" ${d.method===i?'checked':''}> ${x}</label></div>`).join('')}</div><div><h3>3. Három legerősebb bizonyíték</h3>${proofs.map((p,i)=>`<div class="clue"><label><input type="checkbox" onchange="proof9(${i},this.checked)" ${d.proofs.includes(i)?'checked':''}> <b>${p[0]}</b></label><div class="evidence">${p[1]}</div></div>`).join('')}</div></div><div class="buttonrow"><button class="primary" onclick="check9()">Nyomozói jelentés leadása</button><button onclick="showBoard()">Összes bizonyíték</button></div>`)}function sel9(k,i){S.data[9][k]=i;save()}function proof9(i,on){let d=S.data[9];if(on&&!d.proofs.includes(i))d.proofs.push(i);if(!on)d.proofs=d.proofs.filter(x=>x!==i);save();if(d.proofs.length>3){d.proofs=d.proofs.slice(0,3);save();p9();notice('Pontosan három bizonyítékot választhatsz!')}}function check9(){let d=S.data[9];if(d.suspect===null||d.method===null||d.proofs.length!==3)return notice('Válaszolj minden kérdésre, és jelölj meg pontosan három bizonyítékot!');if(d.suspect===3&&d.method===0&&[0,1,2].every(i=>d.proofs.includes(i))){S.done.push(9);S.stage=10;save();render()}else notice('A jelentés még nem meggyőző. A három bizonyítéknak együtt kell igazolnia a biztonsági rendszer szabotálását és a gyanúsított hamis alibijét.')}
