const KEY='koddetektivek-v2_2';let S;const $=id=>document.getElementById(id),app=$('app');const rand=()=>{let x=S.seed|0;x^=x<<13;x^=x>>>17;x^=x<<5;S.seed=x|0;return (x>>>0)/4294967296};const ri=n=>Math.floor(rand()*n);const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=ri(i+1);[b[i],b[j]]=[b[j],b[i]]}return b};const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const initial=()=>({seed:(Math.random()*0x7fffffff)|0,stage:0,done:[],data:{},attempts:{},started:false});try{S=JSON.parse(localStorage.getItem(KEY))||initial()}catch{S=initial()};const names=['Kamerafelvételek','Biztonsági szoba','Az őr útvonala','Titkos üzenet','A raktár titka','Cipőtalpminta','Lézerrendszer','Szabotált járőrrobot','A gyanúsítottak alibije','A végső leleplezés'];const descriptions=['A felvételek bizonyítják: ismeretlen alak járt a lezárt folyosón.','A napló szerint valaki módosította a biztonsági rendszer működését.','Az őr a lopás idején a múzeum másik részén járőrözött.','A titkosított üzenet a raktárba irányította a nyomozást.','A raktárban rejtett belépőkártyát találtál.','A sérült cipőtalplenyomatot sikerült rekonstruálnod.','Karbantartói jogosultsággal kapcsolták ki a lézervédelmet.','A járőrrobot programjából valaki ellenőrzéseket törölt.','Két egymást kiegészítő adat megcáfolja a karbantartó alibijét.'];const icons=['📹','🔐','🚶','✉️','📦','👣','⚡','🤖','🕵️','🏅'];const stageTitle=n=>`<div class="tag">${n+1}. pálya / 10 · ${n===0||n===3?'Könnyű':n===4||n===5||n===6||n===8||n===9?'Nehezebb':'Közepes'}</div><h2>${icons[n]} ${names[n]}</h2>`;
function ensure(n,make){if(!S.data[n]){S.data[n]=make();save()}return S.data[n]};function notice(t,good=false){let el=$('feedback');if(el){el.className='feedback '+(good?'ok':'bad');el.textContent=t}}function complete(n){if(!S.done.includes(n))S.done.push(n);S.stage=Math.max(S.stage,n+1);save();app.innerHTML=`<section class="panel"><h2>✓ Pálya teljesítve!</h2><p>${descriptions[n]}</p><div class="feedback ok"><b>Megszerezted a(z) ${n+1}. bizonyítékot.</b><p>${descriptions[n]}</p></div><button class="primary" onclick="render()">Következő pálya →</button></section>`;progress()};function progress(){$('progress').innerHTML=names.map((_,i)=>`<span title="${i+1}. ${names[i]}" class="${S.done.includes(i)?'done':''}"></span>`).join('')};function shell(n,intro,instructions,content){app.innerHTML=`<section class="panel">${stageTitle(n)}<div class="story">${intro}</div><p><b>${instructions}</b></p>${content}<div id="feedback"></div></section>`};function showBoard(){const back=S.stage;app.innerHTML=`<section class="panel"><h2>Nyomozótábla</h2><p>Az eddig megszerzett bizonyítékok:</p>${descriptions.map((x,i)=>S.done.includes(i)?`<div class="clue"><b>${i+1}. ${names[i]}</b><div class="evidence">${x}</div></div>`:'').join('')||'<p>Még nincs bizonyítékod.</p>'}<button onclick="render()">Vissza a nyomozáshoz</button></section>`}

function attachOrderDrag(){let host=$('order');let active=null;host.querySelectorAll('.drag-card').forEach(el=>{el.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button!==0)return;active={id:e.pointerId,start:+el.dataset.index,x:e.clientX,y:e.clientY,moved:false};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!active||e.pointerId!==active.id)return;if(Math.abs(e.clientY-active.y)+Math.abs(e.clientX-active.x)>7)active.moved=true;if(!active.moved)return;el.classList.add('dragging');host.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.drag-card');if(target&&host.contains(target))target.classList.add('drag-over')});el.addEventListener('pointerup',e=>{if(!active||e.pointerId!==active.id)return;let from=active.start,was=active.moved;active=null;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.drag-card');if(was&&target&&host.contains(target))moveOrder0(from,+target.dataset.index);else{el.classList.remove('dragging');host.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))}});el.addEventListener('pointercancel',()=>{active=null;el.classList.remove('dragging');host.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'))})})}

function mk1(){// construct with unique solution by enumeration
for(let tries=0;tries<200;tries++){let c=ri(3)+1,d=ri(4)+1,b=2*d,a=c+ri(4)+1,sum=a+b+c+d;if(a>9||new Set([a,b,c,d]).size<4||sum>25)continue;let solutions=[];for(let x=0;x<10;x++)for(let y=0;y<10;y++)for(let z=0;z<10;z++)for(let w=0;w<10;w++)if(y===2*w&&x===z+(a-c)&&x+y+z+w===sum&&z===c&&new Set([x,y,z,w]).size===4)solutions.push([x,y,z,w]);if(solutions.length===1)return {code:[a,b,c,d].join(''),clues:shuffle([`A harmadik számjegy ${c}.`,`Az első számjegy ${a-c}-mal nagyobb a harmadiknál.`,`A második számjegy kétszer akkora, mint a negyedik.`,`A négy számjegy összege ${sum}.`,'Mind a négy számjegy különböző.']),input:''}}return{code:'5623',clues:shuffle(['A harmadik számjegy 2.','Az első számjegy 3-mal nagyobb a harmadiknál.','A második számjegy kétszer akkora, mint a negyedik.','A négy számjegy összege 16.','Mind a négy számjegy különböző.']),input:''}}function p1(){let d=ensure(1,mk1);shell(1,'A felvételeken egy ismeretlen alak a lezárt folyosó felé tart. A nyomozás a biztonsági szobához vezet, de az ajtót négyjegyű számzár védi. Valaki öt cetlit hagyott mellette: ezekből megfejthető a kód.','Fejtsd meg a négyjegyű kódot! Mind az öt nyomot használd!',`<div class="grid three">${d.clues.map(t=>`<div class="clue">${t}</div>`).join('')}</div><div class="screen" id="code">${(d.input||'').padEnd(4,'–')}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','Törlés','0','⌫'].map(t=>`<button onclick="key1('${t}')">${t}</button>`).join('')}</div><div class="buttonrow"><button class="primary" onclick="check1()">Ajtó nyitása</button></div>`)}function key1(k){let d=S.data[1];d.input=k==='Törlés'?'':k==='⌫'?d.input.slice(0,-1):d.input.length<4?d.input+k:d.input;$('code').textContent=d.input.padEnd(4,'–');save()}function check1(){if(S.data[1].input===S.data[1].code)complete(1);else notice('Hibás kód. Ellenőrizd az összes feltételt!')}
function mk2(){// one-correction guaranteed directed corridor path: simple horizontal row with detour walls, 7 steps

function mk2b(){let variants=[{path:[0,1,6,7,12,13,18],cmd:['R','D','R','D','R','D']},{path:[0,5,6,11,12,17,18],cmd:['D','R','D','R','D','R']}];let v=variants[ri(2)],wrong=ri(6),wrongCmd=['U','D','L','R'].filter(x=>x!==v.cmd[wrong])[ri(3)];return {...v,commands:v.cmd.map((x,i)=>i===wrong?wrongCmd:x),pos:v.path[0],trail:[],ran:false}}const dir={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]},arr=['U','D','L','R'];function p2(){let d=ensure(2,mk2b);let cells=Array.from({length:25},(_,i)=>{let walls=[2,3,4,8,9,14,19,20,21,22,23,24];return `<div class="tile ${walls.includes(i)?'wall':''} ${i===18?'target':''} ${d.trail.includes(i)?'selected':''}">${i===d.pos?'🤖':i===18?'💎':walls.includes(i)?'▦':''}</div>`}).join('');shell(2,'A biztonsági szobában megtalálod az őr elektronikus útvonalnaplóját. A napló szerint az őrnek a gyémántteremig kellett volna eljutnia, de egy utasítását valaki megváltoztatta. Derítsd ki, merre járhatott valójában!','A mozgási utasítások között egy hibás. Változtathatsz több nyilat is. Futtasd a programot, és juttasd el az őrt a gyémántterem ajtajáig!',`<div class="layout"><div><div class="grid five">${cells}</div><p class="legend">🤖 Őr · 💎 Cél · ▦ Fal</p></div><div><h3>Utasítások</h3><div class="buttonrow">${d.commands.map((x,i)=>`<button class="${d.pick===i?'selected':''}" onclick="pick2(${i})">${{U:'↑',D:'↓',L:'←',R:'→'}[x]}</button>`).join('')}</div><p class="small dim">Válassz egy nyilat, majd módosítsd:</p><div class="buttonrow">${arr.map(x=>`<button onclick="set2('${x}')">${{U:'↑',D:'↓',L:'←',R:'→'}[x]}</button>`).join('')}</div></div></div><div class="buttonrow"><button class="primary" id="run2" onclick="run2()">▶ FUTTATÁS</button><button onclick="reset2()">Újrakezdés</button>${d.solved?'<button class="primary" onclick="complete(2)">Következő pálya →</button>':''}</div>`)}function pick2(i){S.data[2].pick=i;save();p2()}function set2(x){let d=S.data[2];if(d.pick===undefined)return;d.commands[d.pick]=x;d.pos=d.path[0];d.trail=[];d.solved=false;save();p2()}function reset2(){let d=S.data[2];d.pos=d.path[0];d.trail=[];d.solved=false;save();p2()}let busy=false;async function run2(){if(busy)return;busy=true;let d=S.data[2];d.pos=d.path[0];d.trail=[d.pos];p2();let failed=false;for(const c of d.commands){await new Promise(r=>setTimeout(r,540));let y=Math.floor(d.pos/5),x=d.pos%5;let ny=y+dir[c][0],nx=x+dir[c][1],next=ny*5+nx;if(ny<0||ny>4||nx<0||nx>4||[2,3,4,8,9,14,19,20,21,22,23,24].includes(next)){failed=true;break}d.pos=next;d.trail.push(next);p2()}busy=false;save();if(!failed&&d.pos===18){d.solved=true;save();p2();notice('Sikerült! Az őr biztonságosan eljutott a gyémántterem ajtajáig.',true)}else notice('Az őr nem jutott el a célhoz. Figyeld meg, hol tért el az útvonaltól!')}
const AL='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const messages=['NEZD MEG A RAKTART','A NYOM A RAKTARBAN VAN','KERESD A RAKTART'];function mk3(){return{msg:messages[ri(messages.length)],shift:ri(19)+3,answer:''}}function normalize(s){return s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z]/g,'')};function p3(){let d=ensure(3,mk3);let enc=d.msg.split('').map(c=>AL.includes(c)?AL[(AL.indexOf(c)+d.shift)%26]:c).join('');shell(3,'A biztonsági szoba számítógépe mellett különös cetlit találsz. A betűsor első pillantásra értelmetlen, de mellette ott a megfejtéshez szükséges kódtáblázat. Talán az üzenet a következő nyomhoz vezet.','A táblázat alapján fejtsd meg a rejtjelezett mondatot, majd írd be a megfejtést!',`<div class="clue" style="font-size:25px;letter-spacing:.13em;text-align:center">${enc}</div><p class="cipher-guide">A titkosított üzenet betűit keresd a felső mezőkben. Minden betű alatt közvetlenül az eredeti megfelelője látható. A táblázatot oldalra is görgetheted.</p><div class="cipher-scroll" role="region" aria-label="Betűhelyettesítési kódtáblázat" tabindex="0"><div class="cipher-pairs">${AL.split('').map(c=>`<div class="cipher-pair"><span title="Kódolt betű">${c}</span><span title="Eredeti betű">${AL[(AL.indexOf(c)-d.shift+26)%26]}</span></div>`).join('')}</div></div><p><input id="ans3" aria-label="Megfejtés" style="width:100%;padding:13px" placeholder="A megfejtett üzenet..." value="${d.answer}"></p><button class="primary" onclick="check3()">Ellenőrzés</button>`)}function check3(){let d=S.data[3];d.answer=$('ans3').value;save();if(normalize(d.answer)===normalize(d.msg))complete(3);else notice('Még nem jó a megfejtés. Keresd meg sorban a kódolt betűket!')}
const colors=['Piros','Kék','Zöld','Sárga'],shapes=['▲','●','★'];function mk4(){let col=shuffle([0,1,2,3]),allowed=col.slice(0,2),parity=ri(2),shape=ri(3),answer={col:allowed[ri(2)],num:parity?7:8,shape};let crates=[answer];while(crates.length<9){let c={col:ri(4),num:ri(9)+1,shape:ri(3)};if(allowed.includes(c.col)&&c.num%2===parity&&c.shape===shape)continue;if(crates.some(x=>x.col===c.col&&x.num===c.num&&x.shape===c.shape))continue;crates.push(c)}crates=shuffle(crates);return{crates,allowed,parity,shape,picked:null}}function p4(){let d=ensure(4,mk4);shell(4,'A megfejtett üzenet a múzeum raktárába vezet. Kilenc különböző láda sorakozik a polcokon, és úgy tűnik, valaki az egyikbe rejtett egy fontos bizonyítékot. A helyes ládát csak a mellette talált leírás alapján választhatod ki.','Válaszd ki azt az egy ládát, amelyik minden feltételnek megfelel!',`<div class="clue">A láda <b>${colors[d.allowed[0]]} vagy ${colors[d.allowed[1]]}</b>; a száma <b>${d.parity?'páratlan':'páros'}</b>; a jele <b>${shapes[d.shape]}</b>.</div><div class="grid three">${d.crates.map((c,i)=>`<button class="card ${d.picked===i?'selected':''}" onclick="pick4(${i})"><div class="shapes">📦 ${shapes[c.shape]}</div><b>${c.num}</b><div>${colors[c.col]}</div></button>`).join('')}</div><div class="buttonrow"><button class="primary" onclick="check4()">Láda kinyitása</button></div>`)}function pick4(i){S.data[4].picked=i;save();p4()}function check4(){let d=S.data[4],c=d.crates[d.picked];if(!c)return notice('Először válassz egy ládát!');if(d.allowed.includes(c.col)&&c.num%2===d.parity&&c.shape===d.shape)complete(4);else notice('Nem ebben a ládában van a nyom. Ellenőrizd mindhárom feltételt!')}
const sym=['●','▲','■','◆'];function mk5(){let base=shuffle([0,1,2,3]),missing=shuffle(Array.from({length:16},(_,i)=>i)).slice(0,5);return{base,missing,picked:null,fill:{}}}function sol5(d,i){return d.base[(Math.floor(i/4)+i%4)%4]}function p5(){let d=ensure(5,mk5);shell(5,'A raktár poros padlóján különös, részben elmosódott cipőtalplenyomatot fedezel fel. A megmaradt jelek szabályos mintát alkotnak. Ha helyreállítod a hiányzó részeket, később összehasonlíthatod a nyomot a gyanúsítottak cipőivel.','Figyeld meg a sorokat és az oszlopokat is! Pótold az öt hiányzó jelet!',`<div class="grid four" style="max-width:450px;margin:auto">${Array.from({length:16},(_,i)=>`<button class="tile shapes ${d.picked===i?'selected':''}" onclick="pick5(${i})">${d.missing.includes(i)?(d.fill[i]===undefined?'?':sym[d.fill[i]]):sym[sol5(d,i)]}</button>`).join('')}</div><p class="dim small">Kattints egy kérdőjeles mezőre, majd válassz jelet.</p><div class="buttonrow">${sym.map((x,i)=>`<button onclick="fill5(${i})">${x}</button>`).join('')}</div><div class="buttonrow"><button class="primary" onclick="check5()">Ellenőrzés</button><button onclick="reset5()">Visszaállítás</button></div>`)}function reset5(){let d=S.data[5];d.fill={};d.picked=null;save();p5()}function pick5(i){let d=S.data[5];if(!d.missing.includes(i))return;d.picked=i;save();p5()}function fill5(i){let d=S.data[5];if(d.picked===null)return;d.fill[d.picked]=i;d.picked=null;save();p5()}function check5(){let d=S.data[5];if(d.missing.every(i=>d.fill[i]===sol5(d,i)))complete(5);else notice('Még nem megfelelő a cipőtalpminta. Figyeld meg az eltolódást a sorokban!')}
function mk6(){let base=[[0,1],[1,2],[2,3],[0,2,3]],permutation=shuffle([0,1,2,3]);let sets=shuffle(base.map(a=>a.map(x=>permutation[x])));let chosen=shuffle([0,1,2,3]).slice(0,ri(2)+2);let initial=[false,false,false,false];chosen.forEach(j=>sets[j].forEach(i=>initial[i]=!initial[i]));if(!initial.some(Boolean)){chosen=[ri(4)];initial=[false,false,false,false];chosen.forEach(j=>sets[j].forEach(i=>initial[i]=!initial[i]))}return{sets,initial,beams:[...initial],phase:'discover',test:null,notes:Array.from({length:4},()=>[false,false,false,false]),attempts:0,history:[],solved:false,help:0}}

function p6(){let d=ensure(6,mk6);if(!d.phase||!d.notes){S.data[6]=d=mk6();save()}let discovering=d.phase==='discover';let laserview=`<div class="laser">${d.beams.map((on,i)=>`<div style="text-align:center;flex:1"><div style="font-weight:bold;margin-bottom:7px">${i+1}.</div><div class="beam ${on?'':'off'}" style="height:75px;margin:auto"></div></div>`).join('')}</div><p>Aktív lézerek: <b>${d.beams.filter(Boolean).length}/4</b>${d.history&&d.history.length?`<br><span class="small dim">Próbálkozásod eddig: <b>${d.history.map(i=>'ABCD'[i]).join(' → ')}</b></span>`:''}</p>`;let matrix=`<table class="laser-table"><thead><tr><th>Kapcsoló</th>${[1,2,3,4].map(x=>`<th>${x}. lézer</th>`).join('')}</tr></thead><tbody>${d.notes.map((row,i)=>`<tr><th>${'ABCD'[i]}</th>${row.map((on,j)=>`<td><button aria-label="${'ABCD'[i]} kapcsoló, ${j+1}. lézer: ${on?'hat':'nem hat'}" class="${on?'marked':''}" onclick="mark6(${i},${j})">${on?'✓':'–'}</button></td>`).join('')}</tr>`).join('')}</tbody></table>`;let content=discovering?`<span class="phase-tab phase-current">1. Felderítés</span><span class="phase-tab">2. Hatástalanítás</span><p>Próbáld ki a kapcsolókat egyenként. Minden próba után a „Megfigyeltem – visszaállítás” gombbal állíthatod vissza a lézereket. Figyeld meg, melyik lézerek változtak meg, és jelöld be a táblázatban! A ✓ azt jelenti, hogy a kapcsoló hat a lézerre.</p>${laserview}<div class="buttonrow">${['A','B','C','D'].map((x,i)=>`<button onclick="test6(${i})" ${d.test!==null?'disabled':''}>${x} kapcsoló kipróbálása</button>`).join('')}</div>${d.test!==null?`<div class="feedback ok">A(z) <b>${'ABCD'[d.test]}</b> kapcsoló próbaállása látható. Hasonlítsd össze a kiinduló állapottal!</div><button onclick="finishTest6()">Megfigyeltem – visszaállítás</button>`:''}<h3>Megfigyelési táblázat</h3>${matrix}<div class="buttonrow"><button class="primary" onclick="validate6()">Felderítés befejezése →</button></div>`:`<span class="phase-tab">✓ 1. Felderítés</span><span class="phase-tab phase-current">2. Hatástalanítás</span><p>Most már te irányítod a kapcsolókat. Nyomd meg őket tetszőleges sorrendben, és figyeld meg, hogyan változnak a lézerek! Ha elakadsz, a visszaállítás a második rész kezdeti állapotára hozza vissza a rendszert.</p>${laserview}<h3>Felderített kapcsolatok</h3>${matrix}<div class="buttonrow">${['A','B','C','D'].map((x,i)=>`<button ${d.solved?'disabled':''} onclick="press6(${i})">${x} kapcsoló</button>`).join('')}</div><div class="buttonrow"><button onclick="resetSolve6()">Próbálkozás visszaállítása</button><button onclick="hint6()">Segítséget kérek</button></div>${d.help?`<div class="feedback ok">${laserHint(d)}</div>`:''}${d.solved?'<div class="feedback ok">Sikerült! Mind a négy lézer kikapcsolt. A folyosó szabaddá vált!</div><button class="primary" onclick="complete(6)">Következő pálya →</button>':''}`;shell(6,'A rekonstruált nyomok egy titkos folyosóhoz vezetnek. A lézereket négy kapcsoló vezérli, de egy kapcsoló több lézert is átállíthat. A rendszer kiismerése nélkül a véletlen kapcsolgatás veszélyes lenne.','Először térképezd fel a kapcsolókat, majd a jegyzeteid alapján kapcsold ki a lézereket!',content)}
function test6(i){let d=S.data[6];if(d.phase!=='discover'||d.test!==null)return;d.beams=[...d.initial];d.sets[i].forEach(j=>d.beams[j]=!d.beams[j]);d.test=i;save();p6()}
function finishTest6(){let d=S.data[6];d.test=null;d.beams=[...d.initial];save();p6()}
function mark6(i,j){let d=S.data[6];if(d.phase!=='discover')return;d.notes[i][j]=!d.notes[i][j];save();p6()}
function validate6(){let d=S.data[6];if(d.test!==null)return notice('Előbb állítsd vissza a kapcsoló próbaállását!');if(d.notes.every((row,i)=>row.every((value,j)=>value===d.sets[i].includes(j)))){d.phase='solve';d.beams=[...d.initial];d.history=[];d.help=0;save();p6()}else notice('A táblázatban még van pontatlanság. Próbáld ki egyenként a kapcsolókat, és javítsd a jelöléseket!')}
function press6(i){let d=S.data[6];if(d.phase!=='solve'||d.solved)return;d.sets[i].forEach(j=>d.beams[j]=!d.beams[j]);d.history.push(i);d.attempts++;d.solved=d.beams.every(x=>!x);save();p6();if(!d.solved)notice('Figyeld meg, mely lézerek maradtak aktívak, és döntsd el, melyik kapcsoló legyen a következő!')}
function resetSolve6(){let d=S.data[6];d.beams=[...d.initial];d.history=[];d.solved=false;save();p6()}
function hint6(){let d=S.data[6];if(d.phase!=='solve')return;d.help=Math.min((d.help||0)+1,3);save();p6()}
function mk7(){let n=5,correct=Array.from({length:n*2-1},(_,i)=>i%2===0?'C':'L');let ci=ri(4)*2,li=ri(4)*2+1;let cmds=[...correct];cmds[ci]='L';cmds[li]='C';return{n,correct,original:[...cmds],commands:[...cmds],pos:0,inspected:[],ran:false,solved:false,limit:2,active:-1,failed:false}}
function p7(){let d=ensure(7,mk7);if(!d.commands||!d.original){S.data[7]=d=mk7();save()}let changes=d.commands.filter((c,i)=>c!==d.original[i]).length;let rooms=Array.from({length:d.n},(_,i)=>`<div class="tile room ${d.inspected.includes(i)?'checked':''} ${d.ran&&!d.inspected.includes(i)?'missed':''}">${d.pos===i?'🤖':'🚪'}<br><span class="small">${i+1}. terem</span>${d.inspected.includes(i)?'<div class="small">✓ ellenőrizve</div>':d.ran?'<div class="small">nem ellenőrzött</div>':''}</div>`).join('');shell(7,'A járőrrobotnak mind az öt termet ellenőriznie kellett volna. A programjában két utasítást valaki megváltoztatott. Az utasítások száma megfelelő, de két helyen rossz parancs áll.','A LÉPÉS a következő teremhez visz, az ELLENŐRZÉS az aktuális teremben dolgozik. Futtasd a programot, figyeld meg a robotot, majd javíts ki legfeljebb két utasítást!',`<div class="grid" style="grid-template-columns:repeat(${d.n},minmax(0,1fr))">${rooms}</div><p class="small dim">✓ = ellenőrizve · piros = kimaradt. A robot az 1. teremben kezd.</p><h3>A robot programja</h3><p class="small dim">Módosítások: ${changes}/2. Az utasításokra kattintva LÉPÉS ↔ ELLENŐRZÉS módon válthatsz.</p><div class="grid">${d.commands.map((cmd,i)=>`<div class="step command-row ${d.active===i?'cmd-active':''}"><span>${i+1}. utasítás ${d.commands[i]!==d.original[i]?'· ✎':''}</span><button onclick="toggle7(${i})" ${busy||d.solved?'disabled':''}>${cmd==='L'?'➡ LÉPÉS':'🔎 ELLENŐRZÉS'}</button></div>`).join('')}</div><div class="buttonrow"><button class="primary" onclick="run7()" ${busy||d.solved?'disabled':''}>▶ FUTTATÁS</button><button onclick="reset7()" ${busy||d.solved?'disabled':''}>Eredeti hibás program</button></div>${d.solved?'<div class="feedback ok">Sikerült! A robot mind az öt termet ellenőrizte.</div><button class="primary" onclick="complete(7)">Következő pálya →</button>':''}`)}
function toggle7(i){if(busy)return;let d=S.data[7];if(d.solved)return;let changes=d.commands.filter((v,j)=>v!==d.original[j]).length;if(changes>=2&&d.commands[i]===d.original[i])return notice('Legfeljebb két utasítást módosíthatsz. Egy korábbi javítást visszavonhatsz, ha másikat szeretnél.');d.commands[i]=d.commands[i]==='C'?'L':'C';d.pos=0;d.inspected=[];d.ran=false;d.active=-1;save();p7()}
function reset7(){let d=S.data[7];d.commands=[...d.original];d.pos=0;d.inspected=[];d.ran=false;d.solved=false;d.active=-1;save();p7()}
async function run7(){if(busy)return;busy=true;let d=S.data[7];d.pos=0;d.inspected=[];d.ran=false;d.active=-1;d.failed=false;p7();for(let i=0;i<d.commands.length;i++){d.active=i;let cmd=d.commands[i];if(cmd==='L'){if(d.pos>=d.n-1){d.failed=true;p7();await new Promise(r=>setTimeout(r,450));break}d.pos++}else if(!d.inspected.includes(d.pos))d.inspected.push(d.pos);p7();await new Promise(r=>setTimeout(r,570))}d.active=-1;d.ran=true;d.solved=!d.failed&&d.pos===d.n-1&&d.inspected.length===d.n;busy=false;save();p7();if(!d.solved)notice(`${d.n-d.inspected.length} terem ellenőrzése kimaradt${d.failed?', és a robot túl messzire próbált lépni':''}. Gondold végig, melyik két utasítás hibás!`)}
function mk8(){let names=['Kovács Anna','Nagy Péter','Tóth Éva','Szabó Márk'];let times=[21*60+ri(40),22*60+ri(8),22*60+ri(8),22*60+ri(8)];return {times,selected:null,open:[false,false,false]}}function p8(){let d=ensure(8,mk8);shell(8,'A járőrrobot programja azt bizonyítja, hogy a lopást előre megtervezték. Négy múzeumi dolgozó kerül gyanúba. Most a vallomásaikat kell összevetned a biztonsági feljegyzésekkel: az egyikük története biztosan nem igaz.','Olvasd el a bizonyítékokat! Válaszd ki, kinek az állítását cáfolják biztosan az adatok!',`<div class="grid four">${['Kovács Anna','Nagy Péter','Tóth Éva','Szabó Márk'].map((x,i)=>`<button class="card ${d.selected===i?'selected':''}" onclick="pick8(${i})"><b>${x}</b><p class="small">${['Az irodámban dolgoztam.','A főbejáratot felügyeltem.','A raktárban takarítottam.','A műhelyben dolgoztam.'][i]}</p></button>`).join('')}</div><h3>Bizonyítékok</h3><div class="clue"><b>1. A műhely kamerája</b><p>22:10-től 22:20-ig a műhely üres volt. A felvétel folyamatos, megszakítás nélkül készült.</p></div><div class="clue"><b>2. Műhelyajtó belépési naplója</b><p>Ugyanebben az időszakban senki sem lépett be a műhely egyetlen ajtaján sem.</p></div><div class="clue"><b>3. Biztonsági feljegyzés</b><p>A karbantartói jogosultságot a lopás éjszakáján használták a lézervédelem kikapcsolására.</p></div><button class="primary" onclick="check8()">Vallomás ellenőrzése</button>`)}function pick8(i){S.data[8].selected=i;save();p8()}function check8(){let i=S.data[8].selected;if(i===3)complete(8);else notice('A bizonyítékok nem cáfolják biztosan ennek a dolgozónak az állítását. Vizsgáld meg újra a műhely adatait!')}
function p9(){let d=ensure(9,()=>({suspect:null,method:null,proofs:[]}));let method=['A biztonsági rendszer módosításával és a robot ellenőrzéseinek kihagyásával.','Egy ablakon át jutott be.','A gyémántot nappal, nyitvatartás közben vitte el.'];let people=['Kovács Anna – igazgató','Nagy Péter – biztonsági őr','Tóth Éva – takarító','Szabó Márk – karbantartó'];let proofs=[['Karbantartói jogosultság','A lézervédelmet karbantartói jogosultsággal kapcsolták ki.'],['Szabotált robot','A járőrrobot programjából ellenőrzéseket töröltek.'],['Hamis alibi','A műhely felvétele és belépési naplója cáfolja Szabó Márk állítását.'],['Kamerafelvétel','Ismeretlen személy lépett a lezárt folyosóra.'],['Titkos üzenet','A raktárhoz vezetett.'],['Cipőtalpminta','Részben helyreállított lenyomat; önmagában nem azonosít személyt.']];shell(9,'A nyomozás a végéhez érkezett. A Kék Csillag továbbra is hiányzik, de összegyűjtötted a kamerák, a beléptetőrendszer, a cipőnyom és a gyanúsítottak vallomásainak bizonyítékait. Itt az ideje összeállítani a végső nyomozói jelentést!','Válaszd ki a legvalószínűbb tettest, a módszert és három olyan bizonyítékot, amely együtt alátámasztja a következtetésedet!',`<div class="layout"><div><h3>1. Kit gyanúsítasz?</h3>${people.map((x,i)=>`<div class="step"><label><input type="radio" name="sus" onchange="sel9('suspect',${i})" ${d.suspect===i?'checked':''}> ${x}</label></div>`).join('')}<h3>2. Hogyan játszották ki a védelmet?</h3>${method.map((x,i)=>`<div class="step"><label><input type="radio" name="met" onchange="sel9('method',${i})" ${d.method===i?'checked':''}> ${x}</label></div>`).join('')}</div><div><h3>3. Három legerősebb bizonyíték</h3>${proofs.map((p,i)=>`<div class="clue"><label><input type="checkbox" onchange="proof9(${i},this.checked)" ${d.proofs.includes(i)?'checked':''}> <b>${p[0]}</b></label><div class="evidence">${p[1]}</div></div>`).join('')}</div></div><div class="buttonrow"><button class="primary" onclick="check9()">Nyomozói jelentés leadása</button><button onclick="showBoard()">Összes bizonyíték</button></div>`)}function sel9(k,i){S.data[9][k]=i;save()}function proof9(i,on){let d=S.data[9];if(on&&!d.proofs.includes(i))d.proofs.push(i);if(!on)d.proofs=d.proofs.filter(x=>x!==i);save();if(d.proofs.length>3){d.proofs=d.proofs.slice(0,3);save();p9();notice('Pontosan három bizonyítékot választhatsz!')}}function check9(){let d=S.data[9];if(d.suspect===null||d.method===null||d.proofs.length!==3)return notice('Válaszolj minden kérdésre, és jelölj meg pontosan három bizonyítékot!');if(d.suspect===3&&d.method===0&&[0,1,2].every(i=>d.proofs.includes(i))){S.done.push(9);S.stage=10;save();render()}else notice('A jelentés még nem meggyőző. A három bizonyítéknak együtt kell igazolnia a biztonsági rendszer szabotálását és a gyanúsított hamis alibijét.')}
